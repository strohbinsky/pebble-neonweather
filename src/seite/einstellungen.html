<!DOCTYPE html>
<!-- Settings page of Neonweather. tools/seite_erzeugen.py turns it into src/pkjs/seite.js; the phone script fills in
     the state (z: day, night, presets), the colour list (L), the pressure positions (D), the block contents (IN) and
     the blocks (BL) from logik.js plus the symbols for the preview (SY, from symbole.js, since 0.22.0) and the font of the free text
     (SC, from schrift.js, since 0.28.0) at the bottom of the script and opens it as a data: URL. The placeholders must appear there and nowhere else.
     Night: z.nacht holds only changed values; everything else the night shows and takes from the day.
     Since 0.14.0 in collapsible sections; every colour sits next to its function.
     Presets since 0.21.0: "Load" asks what for — day (the night keeps its look), night (the preset's day look) or both.
     Language since 0.27.0: the page is written in English; DE holds the German texts, uebersetzen() swaps them in when sp = "de".
     Since 0.28.0: time axis 0–24 h, free text per block, 3D edge per block and colours of the symbol families (empty = inherit).
     Since 0.30.0: presets arrive as differences from the default (z.std) and the page as Base64; a main digit colour that time, blocks
     and symbol families inherit (colour and 3D edge); section "Digits & symbols"; time axis below the tabs; small preview while
     scrolling; sample weather and time for the preview; the page keeps its state in the URL fragment (reloads of the web view).
     Since 0.31.0: pressure line width as a slider 1–20 px (staerke_d) like the time lines, centred on the value. -->

// Preset row (p = own, v = stock); after "Load" the choice what for appears below (since 0.21.0, on the page instead of confirm())

// Imported values: missing, wrong type or unknown content → default (since 0.30.0: codes are compact, missing = default;
// until 0.29.0 the current day). nurDa: keep only what is there, for the night
function themaSaeubern(t, nurDa) {
  var e = { farben: {}, optionen: {} };
  for (var k in STD.farben) {
    var c = t && t.farben ? t.farben[k] : undefined;
    if (typeof c === "string" && (/^(00|55|AA|FF){3}$/i.test(c) || (erbOk(k) && c === "") || (ohneOk(k) && c === "none"))) e.farben[k] = c === "none" ? c : c.toUpperCase();
    else if (!nurDa) e.farben[k] = STD.farben[k];
  }
  for (k in STD.optionen) {
    var v = t && t.optionen ? t.optionen[k] : undefined, ok;
    if (k === "achse" && v === undefined && t && t.optionen && typeof t.optionen.achse24 === "boolean") v = t.optionen.achse24 ? 1 : 0;   // code from 0.28.0
    if (k === "achse" && typeof v === "number" && !(v >= 0 && v <= 2 && v % 1 === 0)) v = undefined;
    if (k === "staerke_d" && v === undefined && t && t.optionen && typeof t.optionen.dicke_d === "number") v = t.optionen.dicke_d + 1;   // code until 0.30.0: index 0–3
    if (/^staerke_/.test(k) && typeof v === "number" && !(v >= 1 && v <= 20 && v % 1 === 0)) v = undefined;
    if (k === "ebenen" && v === undefined && t && t.optionen && typeof t.optionen.regen_hinter === "boolean") v = t.optionen.regen_hinter ? "120345678" : EB_STD;   // until 0.32.0
    if (k === "ebenen" && typeof v === "string" && (v.length !== 9 || v.split("").sort().join("") !== EB_STD)) v = undefined;
    ok = typeof v === typeof STD.optionen[k];
    if (ok && /^inhalt_/.test(k)) ok = v % 1 === 0 && typeof IN[v] === "string";
    if (ok && /^zweit_/.test(k)) ok = v % 1 === 0 && typeof IN[v] === "string" && zelle(v);
    if (ok && /^text_/.test(k)) v = v.substring(0, 4);
    if (ok) e.optionen[k] = v; else if (!nurDa) e.optionen[k] = STD.optionen[k];
  }
  return e;
}
function psZeile(p, art, i) {

          "<b data-ps='wahl:" + id + "'>Load</b>" + (art === "p" ? "<b data-ps='teilen:" + i + "'>Share</b><b class='weg' data-ps='weg:" + i + "'>Delete</b>" : "") + "</div>";
  if (art === "p" && teilen === i) h += "<div class='code'><textarea id='pscode' readonly>" + esc(psCode(p)) + "</textarea>" +
    "<p class='info'>Copy the code and pass it on — it goes back in under Import.</p><b data-ps='kopieren'>Copy</b></div>";
  if (wahl === id) h += "<div class='chips wahl'><b data-ps='auf:tag:" + id + "'>For day</b><b data-ps='auf:nacht:" + id + "'>For night</b>" +

          "<span data-tab='nacht' class='" + (seite === "nacht" ? "a" : "") + "'>Night</span></div>";
  if (seite === "nacht") {
    h += "<div class='o' data-nm='1'><span>Night mode<small>from sunset to sunrise where you are</small></span><span class='s" +
         (z.nacht.an ? " a" : "") + "'></span></div>" +
         (z.nacht.an ? "" : "<p class='info' style='color:#FF55FF'>Night mode is off: what you set here kicks in once it’s on.</p>") +
         "<p class='info'>The night borrows everything from the day. Changes here apply at night only; ↺ brings back the day value.</p>";
  }
  h += achseZeile();
  // Sections; a section can depend on others (Curves). At night the header counts the changed values (0.30.0)
  ABSCHNITTE.forEach(function (a) {
    if (a[4] && !a[4]()) return;
    var inn = a[3](), n = seite === "nacht" ? (inn.match(/data-reset=/g) || []).length : 0;
    h += "<div class='sek'><div class='kopf' data-sek='" + a[0] + "'>" + a[1] + "<small>" + a[2] + "</small>" +
         (n ? "<small class='ae'>" + n + (sp === "de" ? " geändert" : " changed") + "</small>" : "") + "<b>" + (sek[a[0]] ? "▾" : "▸") + "</b></div>" +
         (sek[a[0]] ? "<div class='inn'>" + inn + "</div>" : "") + "</div>";
  });
  if (PC && pcAn) h += pcFeld();                   // configurator: the code below the sections, right above the buttons
  document.getElementById("inhalt").innerHTML = uebersetzen(h);
  vsZeigen();
  document.getElementById("hw").textContent = T("Preview with sample data, simplified font");

// Preview controls (0.30.0, not saved): sample weather and time
