<!DOCTYPE html>
<!-- Settings page of Neonweather. tools/seite_erzeugen.py turns it into src/pkjs/seite.js; the phone script fills in
     the state (z: day, night, presets), the colour list (L), the pressure positions (D), the block contents (IN) and
     the blocks (BL) from logik.js plus the symbols for the preview (SY, from symbole.js, since 0.22.0) and the font of the free text
     (SC, from schrift.js, since 0.28.0) at the bottom of the script and opens it as a data: URL. The placeholders must appear there and nowhere else.
     Night: z.nacht holds only changed values; everything else the night shows and takes from the day.
     Since 0.14.0 in collapsible sections; every colour sits next to its function.
     Presets since 0.21.0: "Load" asks what for — day (the night keeps its look), night (the preset's day look) or both.
     Language since 0.27.0: the page is written in English; DE holds the German texts, uebersetzen() swaps them in when sp = "de".
     Since 0.28.0: time axis 0–24 h, free text per block, 3D edge per block and colours of the symbol families (empty = inherit).
     Since 0.30.0: presets arrive as differences from the default (z.std) and the page as Base64; a main digit colour that time, blocks
     and symbol families inherit (colour and 3D edge); section "Digits & symbols"; time axis below the tabs; small preview while
     scrolling; sample weather and time for the preview; the page keeps its state in the URL fragment (reloads of the web view).
     Since 0.31.0: pressure line width as a slider 1–20 px (staerke_d) like the time lines, centred on the value. -->
