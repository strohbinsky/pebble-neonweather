<!DOCTYPE html>
<!-- Settings page of Neonweather. tools/seite_erzeugen.py turns it into src/pkjs/seite.js; the phone script fills in
     the state (z: day, night, presets), the colour list (L), the pressure positions (D), the block contents (IN) and
     the blocks (BL) from logik.js plus the symbols for the preview (SY, from symbole.js, since 0.22.0) at the bottom of the script and opens it as a data: URL. The placeholders must appear there and nowhere else.
     Night: z.nacht holds only changed values; everything else the night shows and takes from the day.
     Since 0.14.0 in collapsible sections; every colour sits next to its function.
     Presets since 0.21.0: "Load" asks what for — day (the night keeps its look), night (the preset's day look) or both.
     Language since 0.27.0: the page is written in English; DE holds the German texts, uebersetzen() swaps them in when sp = "de". -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neonweather</title>
<style>
*{box-sizing:border-box}body{font-family:sans-serif;margin:0;padding:16px;background:#111;color:#eee}
h1{font-size:20px;margin:0 0 10px}
#v{display:block;margin:0 auto;width:200px;height:228px;image-rendering:pixelated;border-radius:6px}
.hinweis{text-align:center;color:#888;font-size:12px;margin:4px 0 0}.info{color:#aaa;font-size:13px;margin:4px 2px 10px}
.reiter{display:flex;gap:8px;margin:14px 0 8px}.reiter span{flex:1;text-align:center;padding:10px;border-radius:10px;background:#222;font-size:16px;cursor:pointer}
.reiter span.a{background:#AA00AA;color:#fff}
.sek{background:#1b1b1b;border-radius:12px;margin-bottom:8px;overflow:hidden}
.kopf{display:flex;align-items:center;padding:14px;font-size:17px;cursor:pointer}.kopf small{color:#888;font-size:13px;margin-left:8px}
.kopf b{margin-left:auto;font-weight:normal;color:#aaa}.inn{padding:0 10px 10px}
.u{color:#aaa;font-size:13px;text-transform:uppercase;letter-spacing:.05em;margin:12px 4px 6px}
.z,.o{display:flex;align-items:center;gap:12px;background:#262626;border-radius:10px;padding:10px 12px;margin-bottom:6px;font-size:16px;cursor:pointer}
.z small{margin-left:auto;color:#888;font-family:monospace}.o small{display:block;color:#888;font-size:13px}
.w{opacity:.45}.x{margin-left:8px;color:#FF55FF;font-size:20px;padding:0 4px}
.k{width:40px;height:24px;border-radius:4px;flex:none;border:1px solid #666;display:inline-block}
.o .r{width:22px;height:22px;border-radius:50%;border:2px solid #888;flex:none}.o .r.a{background:#AA00AA;border-color:#FF55FF}
.s{width:44px;height:24px;border-radius:12px;background:#444;flex:none;position:relative;margin-left:auto;display:inline-block}
.s.a{background:#AA00AA}.s:after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff}.s.a:after{left:23px}
.chips{display:flex;gap:6px;width:100%;margin-top:6px}.chips b{flex:1;text-align:center;font-weight:normal;padding:8px 0;border-radius:8px;background:#333;cursor:pointer}
.chips b.a{background:#AA00AA}.chips.sp{margin:0 0 4px}.chips.sp b{padding:6px 0;font-size:14px}
.blk{background:#262626;border-radius:10px;padding:10px 12px;margin-bottom:6px}.blk .t{font-size:14px;color:#ccc;margin-bottom:6px}
.blk .zl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.blk select{flex:1;min-width:120px;font-size:15px;padding:8px;border-radius:8px;background:#333;color:#eee;border:0}
.mini{display:flex;flex-direction:column;align-items:center;font-size:11px;color:#999;gap:2px;cursor:pointer}
.p{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;background:#151515;border-radius:10px;padding:8px;margin:-2px 0 10px}
.f{aspect-ratio:1;border-radius:4px;border:1px solid #333}.f.a{outline:3px solid #fff;outline-offset:-1px}
.ps{display:flex;align-items:center;gap:8px;background:#262626;border-radius:10px;padding:10px 12px;margin-bottom:6px;font-size:16px}
.ps span:first-child{flex:1}.pn{font-style:normal}.ps small{display:block;color:#888;font-size:13px}
.wahl{flex-wrap:wrap;margin:-2px 0 8px}.wahl b{min-width:40%;font-size:15px}.ps b{font-weight:normal;padding:6px 10px;border-radius:8px;background:#333;cursor:pointer}.ps b.weg{color:#ff7777}
.neu{display:flex;gap:8px;margin-bottom:6px}.neu input{flex:1;min-width:0;font-size:16px;padding:10px;border-radius:10px;border:1px solid #444;background:#1a1a1a;color:#eee}
.neu b{font-weight:normal;padding:10px 14px;border-radius:10px;background:#333;cursor:pointer}
.code{background:#1b1b1b;border-radius:10px;padding:8px 10px;margin:-2px 0 8px}.code textarea{width:100%;height:96px;font-size:12px;font-family:monospace;background:#111;color:#ccc;border:1px solid #444;border-radius:8px;padding:6px}.code b{display:inline-block;font-weight:normal;padding:8px 14px;border-radius:8px;background:#333;cursor:pointer}
button{width:100%;padding:14px;font-size:17px;border:0;border-radius:10px;background:#AA00AA;color:#fff;margin-top:10px}
button.std{background:#222;color:#ddd;border:1px solid #555}
</style></head>

var DE = {
  "Preview with sample data, simplified font": "Vorschau mit Beispieldaten, Schrift vereinfacht", "Save": "Speichern",

  "Row 1 · top": "Zeile 1 · oben", "Show row 1": "Zeile 1 zeigen", "above the date, sunrise by default": "über dem Datum, Standard Sonnenaufgang",

  "Rain": "Regen", "position, scale, color": "Lage, Skala, Farbe", "Position": "Lage", "Scale": "Skala",

  "Bottom, narrow": "Unten schmal", "between the temperature and the edge": "zwischen Temperatur und Rand", "the whole lower half, above the rain": "ganze untere Hälfte, über dem Regen",
  "Time lines": "Zeitlinien", "vertical and horizontal": "senkrecht und waagerecht", "Vertical": "Senkrecht", "Horizontal": "Waagerecht",
  "Vertical time line": "Senkrechte Zeitlinie", "a line at the current time": "Strich bei der aktuellen Uhrzeit",

  "Pressure (baro)": "Luftdruck (Baro)", "Time digits": "Ziffern Uhrzeit", "Digit outline": "Ziffernrand", "3D edge": "3D-Kante", "Time bar": "Balken Uhrzeit",
  "Twilight 1": "Dämmerung 1", "Twilight 2": "Dämmerung 2", "Time line frame": "Rahmen der Zeitlinien", "Edge": "Kante", "Dot “now”": "Punkt „jetzt“", "Outline": "Rand",
  "Dot edge": "Kante des Punkts", "Sunrise": "Aufgang", "Sunset": "Untergang",
  "empty": "leer", "Month": "Monat", "Low": "Tiefstwert", "High": "Höchstwert", "Sunrise hour": "Aufgang Stunde", "Sunrise minute": "Aufgang Minute",

  "Arrow down": "Pfeil runter", "Umbrella": "Schirm", "Snowflake": "Schneeflocke", "Lightning": "Blitz", "Windsock": "Windsack", "Cloud crossed out": "Wolke durchgestrichen",

[1, 2, 4, 5].forEach(function (r) {

  });
});
function T(s) { return sp === "de" && DE.hasOwnProperty(s) ? DE[s] : s; }
// German: swap every text between two tags and the label/placeholder attributes; anything not in DE stays as it is.
// Own preset names (<i class='pn'>) and the share code stay untouched
function uebersetzen(h) {
  if (sp !== "de") return h;
  return h.replace(/(<[^<>]*>)([^<>]+)(?=<)/g, function (m, tag, t) {
    var k = t.trim();
    return DE.hasOwnProperty(k) && tag.indexOf("class='pn'") < 0 && tag.indexOf("<textarea") < 0 ? tag + t.split(k).join(DE[k]) : m;
  })
          .replace(/ (label|placeholder)='([^']*)'/g, function (m, a, t) { return DE.hasOwnProperty(t) ? " " + a + "='" + DE[t] + "'" : m; });
}

// Value in the view shown: at night the changed value, otherwise the day's
function eff(gr, k) { return seite === "nacht" && z.nacht[gr].hasOwnProperty(k) ? z.nacht[gr][k] : z.tag[gr][k]; }
function eigen(gr, k) { return seite === "nacht" && z.nacht[gr].hasOwnProperty(k); }
function setz(gr, k, v) { if (seite === "nacht") z.nacht[gr][k] = v; else z.tag[gr][k] = v; }
function marke(gr, k) {
  if (seite !== "nacht") return "";
  return eigen(gr, k) ? "<span class='x' data-reset='" + gr + ":" + k + "'>↺</span>" : "<small>as day</small>";
}
function blass(gr, k) { return seite === "nacht" && !eigen(gr, k) ? " w" : ""; }

// ---------- Building blocks ----------
function schalter(k, titel, info) {
  return "<div class='o" + blass("optionen", k) + "' data-sw='" + k + "'><span>" + titel + (info ? "<small>" + info + "</small>" : "") + "</span>" +

}
function chips(k, werte, titel, info) {
  var v = eff("optionen", k), h = "<div class='o" + blass("optionen", k) + "' style='flex-wrap:wrap;cursor:default'><span>" + titel +

  werte.forEach(function (w, i) { h += "<b data-ch='" + k + ":" + i + "' class='" + ((v === true ? 1 : v === false ? 0 : v) === i ? "a" : "") + "'>" + w + "</b>"; });

}
// Slider (since 0.15.0): while dragging only value and preview update, on release the whole page (↺ at night)
function regler(k, titel, min, max) {
  var v = eff("optionen", k);
  return "<div class='o" + blass("optionen", k) + "' style='flex-wrap:wrap;cursor:default'><span>" + titel + "<small id='rw_" + k + "'>" + v + " px</small></span>" +

         "' style='width:100%;accent-color:#AA00AA;margin-top:6px'></div>";

  var h = "<div class='u'>" + titel + "</div>";

         e[0] + "<small>" + e[1] + "</small></span>" + (i === liste.length - 1 ? marke("optionen", k) : "") + "</div>";
  });
  return h;

  return h + "</div>";
}

  var c = eff("farben", k);
  return "<div class='z" + blass("farben", k) + "' data-k='" + k + "'><span class='k' style='background:#" + c + "'></span>" + NAME[k] +

}
// Block: content, bar on/off, digit and bar colour in one card; at night one ↺ for all four values
// Contents (0.22.0), numbers as enum W_… in main.c (fixed symbols from 64 since 0.23.0): numbers and "whole block" use both cells, symbols one
var W_FEST = 64, GRUPPEN = [["Numbers", [1, 2, 3, 4, 5, 6, 7, 8, 9]], ["Whole block", [10, 18, 12]], ["Smart symbols", [11, 13, 14, 15, 16, 17]],
                            ["Fixed symbols", IN.map(function (n, j) { return j; }).slice(W_FEST)]];

function auswahl(k, v, nurZelle) {
  var h = "<select data-in='" + k + "'><option value='0'" + (v === 0 ? " selected" : "") + ">" + IN[0] + "</option>";
  GRUPPEN.forEach(function (gr) {
    if (nurZelle && !zelle(gr[1][0])) return;
    h += "<optgroup label='" + gr[0] + "'>";
    gr[1].forEach(function (j) { h += "<option value='" + j + "'" + (v === j ? " selected" : "") + ">" + IN[j] + "</option>"; });
    h += "</optgroup>";
  });

}
function block(i, titel) {

  var h = "<div class='blk" + (seite === "nacht" && !geaendert ? " w" : "") + "'><div class='t'>" + titel +

// ---------- Preview of the view shown: same dimensions as main.c, digits in a system font ----------
function vorschau() {
  var x = document.getElementById("v").getContext("2d"), i, h;
  var R = [0, 0, .2, .5, 1, .6, .1, 0, 0, 0, 0, .3, .8, 1.5, .4, 0, 0];
  var PD = [1003, 1003.5, 1004, 1005, 1006.5, 1008, 1009, 1010, 1011, 1012, 1012.5, 1013, 1013.5, 1014, 1015, 1015.5, 1016];
  function f(k) { return "#" + eff("farben", k); }
  function o(k) { return eff("optionen", k); }
  var datum = o("balken_2l") || o("balken_2r"), temp = o("balken_4l") || o("balken_4r"), unten = o("regenlage") === 1;
  var oben0 = o("zeile1") && (o("balken_1l") || o("balken_1r")) ? 47 : 2;

  function himmelZeile(y) {                           // like himmel_zeile() in main.c: areas can be off, without twilight the night lasts until sunrise
    var m = Math.floor((y * 1440 + 720) / 228), tag = m >= SO[1] && m < SO[2];   // 0.27.0: 00:00 at the top
    var nacht = o("sonne_daemmerung") ? m < SO[0] || m >= SO[3] : !tag;
    x.fillStyle = f(nacht ? (o("sonne_nacht") ? "s_nacht" : "grund") : tag ? (o("sonne_tag") ? "s_tag" : "grund") : "s_d1"); x.fillRect(0, y, 200, 1);
    if (!nacht && !tag && o("verlauf")) {
      var nu = m < SO[1] ? m - SO[0] : SO[3] - m, de = m < SO[1] ? SO[1] - SO[0] : SO[3] - SO[2];
      x.fillStyle = f("s_d2");
      for (var px = 0; px < 200; px++) if (2 * nu * 16 > (2 * B4[y % 4][px % 4] + 1) * de) x.fillRect(px, y, 1, 1);
    }

    else if (o("regenvoll")) h = hm;
    else if (unten) h = Math.min(45, Math.round(45 * Math.sqrt(R[i] / 4)));
